
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign HQ</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #171c23;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    header {
      background: #252d38;
      padding: 32px 16px;
      text-align: center;
      border-bottom: 3px solid #b69a62;
    }

    h1 {
      margin: 0;
      letter-spacing: 3px;
    }

    header p { color: #c9c9c9; }

    main {
      max-width: 560px;
      margin: 35px auto;
      padding: 0 16px;
    }

    .card {
      background: #252d38;
      border: 1px solid #b69a62;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 18px;
    }

    h2 { margin-top: 0; }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #68717c;
      background: #171c23;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #b69a62;
      color: #171c23;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #414c5a;
      color: white;
    }

    .status {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success { color: #b9d8a2; }
    .error { color: #ff9b9b; }

    .hidden { display: none; }

    .note {
      color: #b9bec6;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h1>CAMPAIGN HQ</h1>
    <p>Tabletop Campaign Manager</p>
  </header>

  <main>
    <section class="card">
      <h2>Join Campaign</h2>
      <p>Enter your player name and campaign code.</p>

      <form id="joinForm">
        <label for="playerName">Player Name</label>
        <input
          id="playerName"
          type="text"
          maxlength="40"
          autocomplete="nickname"
          required
        >

        <label for="campaignCode">Campaign Code</label>
        <input
          id="campaignCode"
          type="text"
          maxlength="40"
          autocapitalize="characters"
          required
        >

        <button id="joinButton" type="submit">
          Join Campaign
        </button>
      </form>

      <p id="joinMessage" class="status" role="status"></p>
    </section>

    <section class="card">
      <h2>Administrator</h2>

      <p id="connectionStatus" class="status">
        Connecting to Firebase...
      </p>

      <form id="loginForm" class="hidden">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" type="submit">
          Admin Login
        </button>
      </form>

      <div id="accountPanel" class="hidden">
        <p id="accountInfo" class="status"></p>
        <button id="logoutButton" class="secondary" type="button">
          Sign Out
        </button>
      </div>

      <p id="adminMessage" class="status" role="status"></p>
    </section>

    <p class="note">
      Campaign HQ – Development Version<br>
      Campaign management is coming soon.
    </p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signInAnonymously,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZRTF-fjOZu4uKJy9OPMb27ZLWRNNmVts",
      authDomain: "campaign-hq-12765.firebaseapp.com",
      databaseURL: "https://campaign-hq-12765-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "campaign-hq-12765",
      storageBucket: "campaign-hq-12765.firebasestorage.app",
      messagingSenderId: "488850135352",
      appId: "1:488850135352:web:ca42961977f50ed9a889cd"
    };

    const ADMIN_UID = "rAl5A3mqGaZytHCImO6jxRKCtq92";

    const $ = (id) => document.getElementById(id);

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      $("connectionStatus").textContent =
        "Firebase connected.";
      $("connectionStatus").className =
        "status success";

      onAuthStateChanged(auth, (user) => {
        $("adminMessage").textContent = "";

        if (user && !user.isAnonymous) {
          $("loginForm").classList.add("hidden");
          $("accountPanel").classList.remove("hidden");

          $("accountInfo").textContent =
            user.uid === ADMIN_UID
              ? "Administrator signed in: " + user.email
              : "Signed in without administrator permissions.";
        } else {
          $("accountPanel").classList.add("hidden");
          $("loginForm").classList.remove("hidden");
        }
      });

      $("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = $("email").value.trim();
        const password = $("password").value;

        $("loginButton").disabled = true;
        $("adminMessage").textContent = "Signing in...";
        $("adminMessage").className = "status";

        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
          $("adminMessage").textContent =
            "Sign-in failed. Please check your email and password.";
          $("adminMessage").className = "status error";
        } finally {
          $("loginButton").disabled = false;
          $("password").value = "";
        }
      });

      $("logoutButton").addEventListener("click", async () => {
        try {
          await signOut(auth);
        } catch (error) {
          $("adminMessage").textContent = "Sign-out failed.";
          $("adminMessage").className = "status error";
        }
      });

      $("joinForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const name = $("playerName").value.trim();
        const code = $("campaignCode").value.trim().toUpperCase();

        if (!name || !code) {
          $("joinMessage").textContent =
            "Please enter your name and campaign code.";
          $("joinMessage").className = "status error";
          return;
        }

        $("joinButton").disabled = true;
        $("joinMessage").textContent = "Preparing player access...";
        $("joinMessage").className = "status";

        try {
          if (auth.currentUser &&
              !auth.currentUser.isAnonymous) {
            $("joinMessage").textContent =
              "Please sign out of the administrator account before joining as a player.";
            $("joinMessage").className = "status error";
            return;
          }

          if (!auth.currentUser) {
            await signInAnonymously(auth);
          }

          $("joinMessage").textContent =
            "Player access ready. Campaign joining is not available yet.";
          $("joinMessage").className = "status success";

        } catch (error) {
          $("joinMessage").textContent =
            "Player sign-in failed. Please try again.";
          $("joinMessage").className = "status error";
        } finally {
          $("joinButton").disabled = false;
        }
      });

    } catch (error) {
      $("connectionStatus").textContent =
        "Firebase initialization failed.";
      $("connectionStatus").className = "status error";
    }
  </script>
</body>
</html>
