
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign HQ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #171c23;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    header {
      background: #252d38;
      padding: 32px 16px;
      text-align: center;
      border-bottom: 3px solid #e6c477;
    }

    h1 {
      margin: 0;
      letter-spacing: 3px;
    }

    header p {
      color: #c9c9c9;
    }

    main {
      max-width: 560px;
      margin: 35px auto;
      padding: 0 16px;
    }

    .card {
      background: #252d38;
      border: 1px solid #b69a62;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 18px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 2px solid #91a5bb;
      background: #171c23;
      color: white;
      font-size: 16px;
    }

    select {
      cursor: pointer;
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 3px solid #f3d895;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 2px solid #f3d895;
      border-radius: 9px;
      background: #e6c477;
      color: #17202b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, .3);
      transition: background .15s, transform .15s;
    }

    button:active:not(:disabled) {
      background: #f5d992;
      transform: scale(.98);
    }

    button:disabled {
      background: #353d47;
      color: #929aa5;
      border-color: #68717c;
      box-shadow: none;
      opacity: 1;
      cursor: not-allowed;
    }

    .secondary {
      background: #52657a;
      color: #ffffff;
      border-color: #91a5bb;
    }

    .secondary:active:not(:disabled) {
      background: #657b93;
    }

    .status {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      color: #b9d8a2;
    }

    .error {
      color: #ff9b9b;
    }

    .hidden {
      display: none;
    }

    .code {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #b9d8a2;
      overflow-wrap: anywhere;
    }

    .note {
      color: #b9bec6;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<header>
  <h1>CAMPAIGN HQ</h1>
  <p>Tabletop Campaign Manager</p>
</header>

<main>

  <section class="card">
    <h2>Join Campaign</h2>
    <p>Enter your player name and campaign code.</p>

    <form id="joinForm">
      <label for="playerName">Player Name</label>
      <input
        id="playerName"
        maxlength="40"
        required
      >

      <label for="campaignCode">Campaign Code</label>
      <input
        id="campaignCode"
        maxlength="40"
        autocapitalize="characters"
        required
      >

      <button id="joinButton" type="submit">
        Join Campaign
      </button>
    </form>

    <p id="joinMessage" class="status" role="status"></p>
  </section>

  <section class="card">
    <h2>Administrator</h2>

    <p id="connectionStatus" class="status">
      Connecting to Firebase...
    </p>

    <form id="loginForm" class="hidden">
      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Admin Login
      </button>
    </form>

    <div id="accountPanel" class="hidden">
      <p id="accountInfo" class="status"></p>

      <button
        id="logoutButton"
        class="secondary"
        type="button"
      >
        Sign Out
      </button>
    </div>

    <p id="adminMessage" class="status" role="status"></p>
  </section>

  <section id="createPanel" class="card hidden">
    <h2>Create Campaign</h2>
    <p>Set up a new campaign and generate an access code.</p>

    <form id="createForm">
      <label for="campaignType">Campaign</label>

      <select id="campaignType" required>
        <option value="battle-of-the-bulge">
          Battle of the Bulge
        </option>
        <option value="stalingrad">
          Stalingrad
        </option>
      </select>

      <label for="gameMode">Game Mode</label>

      <select id="gameMode" required>
        <option value="historical">
          Historical Mode
        </option>
        <option value="dynamic">
          Dynamic Mode
        </option>
      </select>

      <button id="createButton" type="submit">
        Create Campaign
      </button>
    </form>

    <p id="createMessage" class="status" role="status"></p>

    <div id="createdCampaign" class="hidden">
      <p>Your campaign code:</p>
      <p id="newCampaignCode" class="code"></p>

      <button
        id="copyCodeButton"
        class="secondary"
        type="button"
      >
        Copy Campaign Code
      </button>
    </div>
  </section>

  <p class="note">
    Campaign HQ – Development Version<br>
    Campaign gameplay is coming soon.
  </p>

</main>

<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signInAnonymously,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    runTransaction
  } from
    "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDZRTF-fjOZu4uKJy9OPMb27ZLWRNNmVts",
    authDomain: "campaign-hq-12765.firebaseapp.com",
    databaseURL: "https://campaign-hq-12765-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "campaign-hq-12765",
    storageBucket: "campaign-hq-12765.firebasestorage.app",
    messagingSenderId: "488850135352",
    appId: "1:488850135352:web:ca42961977f50ed9a889cd"
  };

  const ADMIN_UID = "rAl5A3mqGaZytHCImO6jxRKCtq92";

  const $ = (id) => document.getElementById(id);

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  $("connectionStatus").textContent =
    "Firebase initialized.";

  $("connectionStatus").className =
    "status success";

  onAuthStateChanged(auth, (user) => {

    const isAdmin =
      user &&
      !user.isAnonymous &&
      user.uid === ADMIN_UID;

    $("createPanel").classList.toggle(
      "hidden",
      !isAdmin
    );

    if (user && !user.isAnonymous) {

      $("loginForm").classList.add("hidden");
      $("accountPanel").classList.remove("hidden");

      $("accountInfo").textContent = isAdmin
        ? "Administrator signed in: " + user.email
        : "Signed in without administrator permissions.";

    } else {

      $("accountPanel").classList.add("hidden");
      $("loginForm").classList.remove("hidden");

    }
  });

  $("loginForm").addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      $("loginButton").disabled = true;

      $("adminMessage").textContent =
        "Signing in...";

      $("adminMessage").className = "status";

      try {

        await signInWithEmailAndPassword(
          auth,
          $("email").value.trim(),
          $("password").value
        );

        $("adminMessage").textContent = "";

      } catch (error) {

        $("adminMessage").textContent =
          "Sign-in failed. Please check your email and password.";

        $("adminMessage").className =
          "status error";

      } finally {

        $("loginButton").disabled = false;
        $("password").value = "";

      }
    }
  );

  $("logoutButton").addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

      } catch (error) {

        $("adminMessage").textContent =
          "Sign-out failed.";

        $("adminMessage").className =
          "status error";

      }
    }
  );

  $("joinForm").addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const name =
        $("playerName").value.trim();

      const code =
        $("campaignCode").value.trim().toUpperCase();

      if (!name || !code) {

        $("joinMessage").textContent =
          "Please enter your name and campaign code.";

        $("joinMessage").className =
          "status error";

        return;
      }

      $("joinButton").disabled = true;

      $("joinMessage").textContent =
        "Preparing player access...";

      $("joinMessage").className = "status";

      try {

        if (
          auth.currentUser &&
          !auth.currentUser.isAnonymous
        ) {

          $("joinMessage").textContent =
            "Please sign out of your administrator account first.";

          $("joinMessage").className =
            "status error";

          return;
        }

        if (!auth.currentUser) {

          await signInAnonymously(auth);

        }

        $("joinMessage").textContent =
          "Player access ready. Campaign joining is not available yet.";

        $("joinMessage").className =
          "status success";

      } catch (error) {

        $("joinMessage").textContent =
          "Player sign-in failed. Please try again.";

        $("joinMessage").className =
          "status error";

      } finally {

        $("joinButton").disabled = false;

      }
    }
  );

  function generateCode(prefix) {

    const bytes = new Uint32Array(1);

    crypto.getRandomValues(bytes);

    return prefix + "-" +
      String(bytes[0] % 1000000).padStart(6, "0");

  }

  $("createForm").addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const user = auth.currentUser;

      if (
        !user ||
        user.uid !== ADMIN_UID ||
        user.isAnonymous
      ) {

        $("createMessage").textContent =
          "Administrator access required.";

        $("createMessage").className =
          "status error";

        return;
      }

      const type =
        $("campaignType").value;

      const mode =
        $("gameMode").value;

      const prefix =
        type === "stalingrad"
          ? "STAL"
          : "BULGE";

      $("createButton").disabled = true;

      $("createdCampaign").classList.add(
        "hidden"
      );

      $("createMessage").textContent =
        "Creating campaign...";

      $("createMessage").className = "status";

      try {

        let createdCode = null;

        for (
          let attempt = 0;
          attempt < 10;
          attempt++
        ) {

          const code = generateCode(prefix);

          const campaignRef = ref(
            db,
            "campaigns/" + code
          );

          const result = await runTransaction(
            campaignRef,
            (currentData) => {

              if (currentData !== null) {
                return;
              }

              return {
                type: type,
                mode: mode,
                status: "setup",
                createdBy: user.uid,
                createdAt: Date.now(),
                players: {},
                games: {},
                scores: {
                  axis: 0,
                  allies: 0
                }
              };

            },
            {
              applyLocally: false
            }
          );

          if (result.committed) {

            createdCode = code;
            break;

          }
        }

        if (!createdCode) {

          throw new Error(
            "Unable to generate a unique code."
          );

        }

        $("newCampaignCode").textContent =
          createdCode;

        $("createdCampaign").classList.remove(
          "hidden"
        );

        $("createMessage").textContent =
          "Campaign created successfully.";

        $("createMessage").className =
          "status success";

      } catch (error) {

        $("createMessage").textContent =
          "Campaign creation failed. Please try again.";

        $("createMessage").className =
          "status error";

        console.error(error);

      } finally {

        $("createButton").disabled = false;

      }
    }
  );

  $("copyCodeButton").addEventListener(
    "click",
    async () => {

      const code =
        $("newCampaignCode").textContent;

      try {

        await navigator.clipboard.writeText(
          code
        );

        $("createMessage").textContent =
          "Campaign code copied.";

        $("createMessage").className =
          "status success";

      } catch (error) {

        $("createMessage").textContent =
          "Please select and copy the code manually.";

        $("createMessage").className =
          "status error";

      }
    }
  );

</script>

</body>
</html>
