
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campaign HQ</title>
  <style>
    body {
      margin: 0;
      background: #171c23;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      background: #252d38;
      padding: 35px 15px;
      border-bottom: 3px solid #b69a62;
    }
    h1 {
      margin: 0;
      letter-spacing: 3px;
    }
    main {
      padding: 45px 20px;
    }
    .card {
      max-width: 420px;
      margin: auto;
      padding: 25px;
      background: #252d38;
      border: 1px solid #b69a62;
      border-radius: 12px;
    }
    .status {
      color: #b9d8a2;
    }
  </style>
</head>
<body>
  <header>
    <h1>CAMPAIGN HQ</h1>
    <p>Tabletop Campaign Manager</p>
  </header>

  <main>
    <div class="card">
      <h2>Willkommen im Campaign HQ</h2>
      <p>Deine zentrale Plattform für Tabletop-Kampagnen.</p>
      <p class="status">System bereit</p>
      <p>Die Kampagnenauswahl folgt in Kürze.</p>
    </div>
  </main>
</body>
</html>
